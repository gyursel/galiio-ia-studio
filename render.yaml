services:
  - type: web
    name: gyursel-studio-api
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.production.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DB_NAME
        value: galio_ia_studio_2
      - key: CORS_ORIGINS
        value: https://gyursel-studio.vercel.app
      - key: LOCAL_DEV_AUTH
        value: true
